name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit and integration tests
        run: |
          python tests/test_psychology.py
          python tests/test_direction.py
          python tests/test_restarts.py
          python tests/test_execution.py
          python tests/test_metrics.py
          python tests/test_ball_model.py
          python tests/test_visualizer.py
          python tests/test_decisions.py

      - name: Statistical validation gate
        run: python validate.py --matches 20 --seed 42 --gate
